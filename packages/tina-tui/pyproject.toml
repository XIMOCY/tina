[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tina-tui"
version = "0.1.0"
description = "tina 的终端界面（Textual）扩展"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Apache Software License" }
authors = [
    { name = "王出日", email = "wangchuri@163.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "tina-python>=0.7.0",
    "textual>=0.80",
]

[project.urls]
Homepage = "https://gitee.com/wang-churi/tina"
Repository = "https://gitee.com/wang-churi/tina.git"
GitHub = "https://github.com/XIMOCY/tina.git"

[project.scripts]
tinacode = "tina_tui.tinacode:main"

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tina_tui*"]

[tool.setuptools.package-data]
tina_tui = ["py.typed"]
