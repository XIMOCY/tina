[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tina-python"
version = "0.5.2"
description = "tina is in your computer!"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Apache Software License" }
authors = [
    { name = "王出日", email = "wangchuri@163.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx",
    "python-dotenv",
]

[project.urls]
Homepage = "https://gitee.com/wang-churi/tina"
Repository = "https://gitee.com/wang-churi/tina.git"
GitHub = "https://github.com/XIMOCY/tina.git"

[project.optional-dependencies]
mcp = [
    "mcp-python", 
]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
markers = [
    "slow: 需要 LLM 实际调用的测试（默认跳过）",
    "integration: 集成测试",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tina*"]